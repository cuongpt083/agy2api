version: "3.8"

services:
  agy-api:
    build: .
    container_name: agy-api
    restart: unless-stopped
    ports:
      - "8686:8686"
    networks:
      - study
    environment:
      - AGY_API_KEY=sk-dummy
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    # Mount local agy binary, gemini config, persistent data, and app code
    volumes:
      - ~/.local/bin/agy:/usr/local/bin/agy:ro
      - ~/.gemini:/root/.gemini
      - ./data:/app/data
      - ./app:/app/app
networks:
  study:
    external: true

