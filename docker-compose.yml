# version: "3.8"

services:
  agy-api:
    build: .
    ports:
      - "8686:8000"
    networks:
      - study
    environment:
      - AGY_API_KEY=sk-dummy
      - AGY_POOL_SIZE=1
      - AGY_DEFAULT_MODEL=gemini-3.8-flash-high
      - AGY_POOL_MODELS=gemini-3.8-flash-high
      - AGY_POOL_MAX_DYNAMIC_MODELS=3
    volumes:
      - ./app:/app/app:ro
      - ~/.gemini:/root/.gemini
      - ~/.local/bin/agy:/usr/local/bin/agy:ro

networks:
  study:
    external: true
