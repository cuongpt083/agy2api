# Oh-My-Pi custom provider for AGY2API.
# Copy into ~/.omp/agent/models.yml (merge under `providers:`).
#
# OMP may send OpenAI `tools`; AGY2API ignores them and runs `agy`
# with AGY's own tools. Only AGY_API_KEY is required on the host.

providers:
  agy2api:
    baseUrl: http://localhost:8000/v1
    api: openai-completions
    apiKey: AGY_API_KEY
    authHeader: true
    models:
      - id: gemini-3.7-flash-high
        name: Gemini 3.7 Flash (High)
        reasoning: true
        input: [text, image]
        contextWindow: 1000000
        maxTokens: 65536
        cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
        compat:
          supportsDeveloperRole: false
          supportsReasoningEffort: true
          supportsStore: false
          supportsToolChoice: true
          maxTokensField: max_tokens
          supportsUsageInStreaming: true
      - id: gemini-2.5-flash
        name: Gemini 2.5 Flash
        reasoning: true
        input: [text, image]
        contextWindow: 1000000
        maxTokens: 65536
        cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
        compat:
          supportsDeveloperRole: false
          supportsReasoningEffort: true
          supportsStore: false
          supportsToolChoice: true
          maxTokensField: max_tokens
          supportsUsageInStreaming: true
